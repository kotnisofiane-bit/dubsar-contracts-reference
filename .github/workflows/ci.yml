name: DUBSAR Contracts CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.19.0

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: test "$(node --version)" = "v${NODE_VERSION}"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify:public-manifest
      - run: npm run check
      - run: npm run verify:hashes
      - run: npm run verify:broker
      - run: npm run test:contracts

  judgment:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:judgment
      - run: npm run test:judgment

  operational-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:operational-context
      - run: npm run test:operational-context

  s1:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:s1

  broker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:broker

  # Each suite creates cluster-global roles, so each gets its own disposable cluster.
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      pg-broker:
        image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        env: { POSTGRES_USER: dubsar_ci, POSTGRES_DB: dubsar_ci, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ['5432/tcp']
        options: --health-cmd="pg_isready -U dubsar_ci -d dubsar_ci" --health-interval=5s --health-timeout=3s --health-retries=10
      pg-documents:
        image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        env: { POSTGRES_USER: dubsar_ci, POSTGRES_DB: dubsar_ci, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ['5432/tcp']
        options: --health-cmd="pg_isready -U dubsar_ci -d dubsar_ci" --health-interval=5s --health-timeout=3s --health-retries=10
      pg-sessions:
        image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        env: { POSTGRES_USER: dubsar_ci, POSTGRES_DB: dubsar_ci, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ['5432/tcp']
        options: --health-cmd="pg_isready -U dubsar_ci -d dubsar_ci" --health-interval=5s --health-timeout=3s --health-retries=10
      pg-context:
        image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        env: { POSTGRES_USER: dubsar_ci, POSTGRES_DB: dubsar_ci, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ['5432/tcp']
        options: --health-cmd="pg_isready -U dubsar_ci -d dubsar_ci" --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Broker
        env:
          DUBSAR_TEST_POSTGRES_URL: postgresql://dubsar_ci@127.0.0.1:${{ job.services.pg-broker.ports['5432'] }}/dubsar_ci
        run: npm run test:postgres
      - name: Document access
        env:
          DUBSAR_TEST_POSTGRES_URL: postgresql://dubsar_ci@127.0.0.1:${{ job.services.pg-documents.ports['5432'] }}/dubsar_ci
        run: npm run test:document-access:postgres
      - name: Session lifecycle
        env:
          DUBSAR_TEST_POSTGRES_URL: postgresql://dubsar_ci@127.0.0.1:${{ job.services.pg-sessions.ports['5432'] }}/dubsar_ci
        run: npm run test:session-lifecycle:postgres
      - name: Operational Context
        env:
          DUBSAR_TEST_POSTGRES_URL: postgresql://dubsar_ci@127.0.0.1:${{ job.services.pg-context.ports['5432'] }}/dubsar_ci
        run: |
          npm run test:operational-context:postgres
          npm run demo:operational-context
      - name: Disposable transaction smoke
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.pg-context.id }}
        run: docker exec -i "$POSTGRES_CONTAINER_ID" psql --username=dubsar_ci --dbname=dubsar_ci --set=ON_ERROR_STOP=1 < tests/ci/postgres-smoke.sql
